[package]
name = "soundiya"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SoundCloud player and voice control for Yandex Stations with a built-in DPI bypass"
publish = false

[dependencies]
alsa = "0.10"
bytes = "1"
libc = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac"] }
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

[profile.dev]
debug = 0
